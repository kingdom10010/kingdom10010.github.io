  <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一生一世一双人</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: flex;

            align-items: center;
            gap: 20px;
        }
        
        canvas {
            background-color: #000;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(238, 174, 238, 0.3);
        }
        
        .status {
            color: #EEAEEE;
            font-size: 18px;
            height: 27px;
        }
        /* 音乐播放提示样式（与页面紫色调匹配） */
        #playTip {
            color: #EEAEEE;
            font-size: 16px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="heartCanvas" width="840" height="680"></canvas>
        <!-- 1. 新增：音乐播放标签（隐藏控件，预加载） -->
        <audio id="pageMusic" hidden preload="auto">
            <source src="/music/《Always Online》.mp3" type="audio/mpeg"> <!-- 替换为你的音乐路径 -->
            您的浏览器不支持音频播放，请更新浏览器。
        </audio>
        <!-- 2. 新增：备用播放提示（浏览器禁止自动播放时显示） -->
        <div id="playTip">点击页面任意位置播放音乐</div>
    </div>

    <script>
        class HeartAnimationPlayer {
            constructor(canvasId, dataUrl) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.dataUrl = dataUrl;
                this.animationData = null;
                this.currentFrame = 0;
                this.isPlaying = false;
                this.animationId = null;
                this.fps = 4;
                this.frameInterval = 1000 / this.fps;
                this.lastFrameTime = 0;
                
                this.loadAnimationData();
            }
            
            async loadAnimationData() {
                try {
                    const response = await fetch(this.dataUrl);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    this.animationData = await response.json();
                    this.canvas.width = this.animationData.width;
                    this.canvas.height = this.animationData.height;
                    this.play();
                } catch (error) {
                    document.getElementById('status').textContent = '加载数据失败: ' + error.message;
                    console.error('加载动画数据失败:', error);
                }
            }
            
            play() {
                if (this.isPlaying) return;
                this.isPlaying = true;
                this.lastFrameTime = performance.now();
                this.animate();
            }
            
            animate(currentTime = 0) {
                if (!this.isPlaying) return;
                const elapsed = currentTime - this.lastFrameTime;
                if (elapsed > this.frameInterval) {
                    this.currentFrame = (this.currentFrame + 1) % this.animationData.frames.length;
                    this.renderFrame();
                    this.lastFrameTime = currentTime - (elapsed % this.frameInterval);
                }
                this.animationId = requestAnimationFrame((time) => this.animate(time));
            }
            
            renderFrame() {
                this.ctx.fillStyle = 'black';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                const frameData = this.animationData.frames[this.currentFrame];
                this.ctx.fillStyle = this.animationData.color;
                for (const [x, y, size] of frameData) {
                    this.ctx.fillRect(x, y, size, size);
                }
            }
        }
        
        // 3. 新增：音乐控制逻辑
        function initMusicControl() {
            const pageMusic = document.getElementById('pageMusic');
            const playTip = document.getElementById('playTip');

            // 页面加载完成后尝试自动播放
            document.addEventListener('DOMContentLoaded', () => {
                pageMusic.play().catch(() => {
                    // 浏览器禁止自动播放时，显示点击提示
                    playTip.style.display = 'block';
                });
            });

            // 点击页面任意位置播放（备用方案）
            document.addEventListener('click', () => {
                if (playTip.style.display === 'block' && pageMusic.paused) {
                    pageMusic.play();
                    playTip.style.display = 'none'; // 播放后隐藏提示
                }
            });

            // 离开页面（关闭/刷新/跳转）时暂停音乐
            window.addEventListener('beforeunload', () => {
                if (!pageMusic.paused) {
                    pageMusic.pause();
                }
            });
        }
        
        // 初始化：先加载音乐控制，再初始化动画
        window.addEventListener('DOMContentLoaded', () => {
            initMusicControl();
            new HeartAnimationPlayer('heartCanvas', 'heart_data.json');
        });
    </script>
</body>
</html>
